<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌸 FloraNote — Enregistrement</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:16px; text-align:center; background:#fff6f8; color:#333; }
h1 { margin:0 0 10px; font-size:1.8em; }
video { width:100%; max-width:480px; border-radius:12px; background:#000; margin-top:10px; }
button { margin:8px; padding:14px 20px; border:none; border-radius:10px; font-size:16px; font-weight:600; color:#fff; cursor:pointer; }
button.primary{ background:#e91e63; }
button.gray{ background:#ccc; color:#111; }
.small{ font-size:13px; color:#555; margin-top:6px; }
</style>
</head>

<body>
<h1>🌸 FloraNote</h1>
<p>Enregistre ton message vidéo 💐</p>
<h2>ID : <span id="noteId"></span></h2>

<video id="vid" playsinline controls></video><br>
<button id="camBtn" class="primary">🎥 Activer caméra</button>
<button id="recBtn" class="primary">⏺️ Enregistrer</button>
<button id="stopBtn" class="gray" disabled>⏹️ Arrêter</button>
<button id="uploadBtn" class="primary" disabled>☁️ Envoyer sur NAS</button>

<div id="info" class="small"></div>
<footer class="small">© TeamKriKri — Version NAS Synology</footer>

<script>
/* 🔗 Mets ici l’adresse de ton NAS */
const SERVER_UPLOAD = "https://dha-nas2.synology.me/upload.php";

let id = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
if (!id) {
  id = prompt("💐 À qui s’adresse ce message ?") || "demo";
  location.hash = encodeURIComponent(id);
  location.reload();
}
document.getElementById("noteId").textContent = id;

const vid = document.getElementById("vid");
const info = document.getElementById("info");
const camBtn = document.getElementById("camBtn");
const recBtn = document.getElementById("recBtn");
const stopBtn = document.getElementById("stopBtn");
const uploadBtn = document.getElementById("uploadBtn");

let stream = null, recorder = null, chunks = [], blob = null;

/* Activer caméra */
camBtn.onclick = async()=>{
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    vid.srcObject = stream; vid.muted = true; await vid.play();
    info.textContent = "🎥 Caméra activée ✅";
  } catch(e) {
    alert("Autorise la caméra et le micro !");
  }
};

/* Enregistrement */
recBtn.onclick = ()=>{
  if (!stream) { camBtn.click(); setTimeout(()=>recBtn.click(),500); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = ()=>{
    blob = new Blob(chunks, { type: "video/webm" });
    vid.srcObject = null;
    vid.src = URL.createObjectURL(blob);
    vid.controls = true;
    uploadBtn.disabled = false;
    info.textContent = "✅ Vidéo prête à être envoyée.";
  };
  recorder.start();
  recBtn.disabled = true;
  stopBtn.disabled = false;
  info.textContent = "⏺️ Enregistrement...";
};

/* Stop */
stopBtn.onclick = ()=>{
  if (recorder && recorder.state !== "inactive") recorder.stop();
  recBtn.disabled = false;
  stopBtn.disabled = true;
};

/* Envoi vers le NAS */
uploadBtn.onclick = async ()=>{
  if (!blob) { alert("Aucune vidéo à envoyer."); return; }
  info.textContent = "📤 Envoi vers le NAS...";
  const form = new FormData();
  form.append("file", blob, id + ".webm");
  form.append("name", id);
  try {
    const res = await fetch(SERVER_UPLOAD, { method:"POST", body:form });
    const text = await res.text();
    info.innerHTML = `✅ Vidéo envoyée !<br><a href="${text}" target="_blank">🎬 Voir la vidéo</a>`;
    uploadBtn.disabled = true;
  } catch (err) {
    console.error(err);
    info.textContent = "❌ Erreur lors de l'envoi.";
  }
};
</script>
</body>
</html>
