<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎬 FloraNote — Message vidéo</title>
<style>
body{font-family:sans-serif;margin:0;padding:20px;text-align:center;background:#fff6f8;color:#333}
h1{margin:0 0 20px}
video{width:100%;max-width:400px;border-radius:16px;background:#000;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
footer{margin-top:20px;font-size:12px;color:#777}
.loading{margin-top:40px;font-size:16px;color:#555}
</style>
</head>
<body>
<h1>🌸 FloraNote</h1>
<div id="content">
  <div class="loading" id="loading">Chargement du message vidéo...</div>
  <video id="vid" playsinline controls class="hidden"></video>
</div>
<footer>© TeamKriKri — Message FloraNote</footer>

<script>
const id = (location.hash && location.hash.slice(1)) || 'DEMO';
const key = 'floranote_' + id;
const vid = document.getElementById('vid');
const loading = document.getElementById('loading');

const saved = localStorage.getItem(key);

if(saved){
  // Si le lien file.io est trouvé
  vid.src = saved;
  vid.classList.remove('hidden');
  vid.play().catch(()=>{});
  loading.textContent = "🎬 Votre message FloraNote est prêt.";
}else{
  loading.textContent = "❌ Aucun message trouvé pour cette carte.";
}
</script>
</body>
</html>
