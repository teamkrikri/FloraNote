<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🌸 FloraNote — Lecture du message</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #fff6f8;
  color: #333;
  margin: 0;
  padding: 20px;
  text-align: center;
}
h1 { margin-bottom: 5px; }
p { margin-top: 0; }
video {
  width: 100%;
  max-width: 480px;
  border-radius: 12px;
  background: #000;
  margin-top: 15px;
}
button {
  margin-top: 15px;
  padding: 14px 20px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  background: #e91e63;
  cursor: pointer;
}
.small { font-size: 13px; color: #555; margin-top: 12px; }
</style>
</head>

<body>
<h1>🌸 FloraNote</h1>
<p id="subtitle">Lecture du message vidéo</p>
<div id="content">
  <p>Chargement...</p>
</div>
<footer class="small">© TeamKriKri — Version NAS Synology</footer>

<script>
/* 🔗 Adresse publique de ton NAS (QuickConnect ou domaine perso) */
const NAS_URL = "https://dha-nas2.synology.me/videos/";

/* Identifiant pris depuis le QR code (ex. view.html#vanessa) */
let id = location.hash ? decodeURIComponent(location.hash.slice(1)).trim().toLowerCase() : "";
const content = document.getElementById("content");

if (!id) {
  content.innerHTML = `
    <p>💐 Scanne une carte FloraNote pour lire un message vidéo.</p>
    <p>Ou entre un prénom :</p>
    <input id="name" placeholder="ex : Vanessa" style="padding:8px;border-radius:6px;border:1px solid #ccc;">
    <button onclick="go()">Lire</button>
  `;
} else {
  showVideo(id);
}

/* Lancer la lecture depuis le champ manuel */
function go() {
  const name = document.getElementById("name").value.trim().toLowerCase();
  if (name) window.location.hash = encodeURIComponent(name);
  window.location.reload();
}

/* Afficher la vidéo */
function showVideo(name) {
  const url = NAS_URL + encodeURIComponent(name) + ".webm";
  content.innerHTML = `
    <h2>💌 Message pour ${name}</h2>
    <video src="${url}" controls autoplay playsinline></video>
    <div class="small">
      <a href="${url}" target="_blank">🔗 Ouvrir la vidéo dans un nouvel onglet</a>
    </div>
  `;
}
</script>
</body>
</html>
